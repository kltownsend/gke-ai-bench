# Per-test Job manifest. Rendered by orchestrator.py at runtime; placeholders
# (runner-durdir-implicit-resume-19f768, localhost:5001/locust-test:v1.0.1, /app/tests/durdir.py, 1m, 1, 20778a6d,
# durdir_implicit_resume, /tmp/bench/durdir_implicit_resume) are substituted before kubectl apply.

apiVersion: v1
kind: Namespace
metadata:
  name: benchmarking
  labels:
    # ate-system admits API clients only from namespaces with this label.
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-runner
  namespace: benchmarking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automated-benchmarking-permissions
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: benchmark-runner
  namespace: benchmarking
roleRef:
  kind: Role
  name: atelet-endpointslices
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: benchmark-runner-hardware-discovery
rules:
- apiGroups: [""]
  resources: ["nodes"]
  # list only: the runner reads whole collections, never a single object.
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: benchmark-runner-hardware-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmark-runner-hardware-discovery
subjects:
- kind: ServiceAccount
  name: benchmark-runner
  namespace: benchmarking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-runner-worker-pods
  namespace: benchmark-workloads
rules:
- apiGroups: [""]
  resources: ["pods"]
  # get as well as list: the runner reads the worker pod logs after a test
  # for the suspend/resume phase breakdown (phase_breakdown.py).
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Worker pod events, for the evictions in oom_events (cluster_facts.py).
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list"]
---
# The atelet pod logs hold the other half of the phase breakdown.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-runner-atelet-logs
  namespace: ate-system
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-runner-atelet-logs
  namespace: ate-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmark-runner-atelet-logs
subjects:
- kind: ServiceAccount
  name: benchmark-runner
  namespace: benchmarking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmark-runner-worker-pods
  namespace: benchmark-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmark-runner-worker-pods
subjects:
- kind: ServiceAccount
  name: benchmark-runner
  namespace: benchmarking
---
apiVersion: batch/v1
kind: Job
metadata:
  name: runner-durdir-implicit-resume-19f768
  namespace: benchmarking
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: substrate-benchmark-runner
        test-name: durdir_implicit_resume
        tag: 20778a6d
    spec:
      restartPolicy: Never
      serviceAccountName: benchmark-runner
      # Lets the runner land on a node pool reserved for load generators
      # with the taint ate.dev/benchmarking=true:NoSchedule.
      tolerations:
      - key: ate.dev/benchmarking
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: runner
        image: localhost:5001/locust-test:v1.0.1
        imagePullPolicy: IfNotPresent
        command:
        - "python3"
        - "/app/runner.py"
        args:
        - "-f"
        - "/app/tests/durdir.py"
        - "-t"
        - "1m"
        - "-u"
        - "1"
        - "--tag"
        - "20778a6d"
        - "--name"
        - "durdir_implicit_resume"
        - "--dest"
        - "/tmp/bench/durdir_implicit_resume"
        - "--durdir-template"
        - "glutton-durdir-data"
        - "--resume-mode"
        - "implicit"
        - "--durdir-file-size-bytes"
        - "8388608"
        - "--min-wait-time"
        - "1.0"
        - "--max-wait-time"
        - "1.0"
        - "--metadata"
        - "{\"cluster_name\": \"lab-substrate\", \"project_id\": \"example-project\", \"lab_test\": \"durdir_implicit_resume\"}"
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
        # boomer's /metrics; the boomer-worker job of
        # benchmarking/monitoring.yaml scrapes it.
        ports:
        - name: boomer-metrics
          containerPort: 8001
        volumeMounts:
        - name: servicedns-ca
          mountPath: /run/servicedns-ca
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
        # Requests only: the runner shares a dedicated load-test node with
        # nothing else, and a limit would turn a transient marshalling spike
        # at high user counts into an OOM kill mid-run.
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
      volumes:
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: ca.crt
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
