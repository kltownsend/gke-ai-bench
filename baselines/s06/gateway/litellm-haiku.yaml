# clinicbench reader swap: Claude Haiku 5.5 behind LiteLLM, for the frozen OpenAI-format driver.
# Thinking off, to match the Gemma reference cell's reasoning-off reader. drop_params drops what
# Anthropic doesn't take (the driver's seed). The key comes from the Keychain through the
# environment; the workspace ID isn't a secret.
model_list:
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/CB_ANTHROPIC_BASE
      thinking: {type: disabled}
      extra_headers:
        anthropic-workspace-id: wrkspc_01BP3XaSJ3kPs6tA1VCZpmhk
litellm_settings:
  drop_params: true
  num_retries: 3
