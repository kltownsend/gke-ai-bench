# Hardened only: Workload Identity binds the Pods' service account to the lab-agent Google
# service account (roles/aiplatform.user), and egress is denied except DNS, the GKE metadata
# server (how Workload Identity hands out tokens), and Google APIs through Private Google Access
# (private.googleapis.com, 199.36.153.8/30, port 443). The cluster's private DNS zone points
# *.googleapis.com there (infra/cluster.sh). This is the documented plain-GKE control, and it's
# by IP: every Google API behind that range is reachable, which is the egress finding the API
# scope probe measures on this rung.
# Placeholder ${LAB_AGENT} is filled from harness/lab_env.sh when infra/cluster.sh
# applies this file (its render step). By hand: envsubst '${LAB_AGENT}' < FILE | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: lab-agent
  labels:
    # Pod Security admission (build review 5): the agent's Pods must meet the restricted profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-agent
  namespace: lab-agent
  annotations:
    iam.gke.io/gcp-service-account: "${LAB_AGENT}"
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: lab-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  # DNS: kube-dns, and GKE's NodeLocal DNSCache, which this cluster runs by default and which
  # answers the Pod's queries first (found on the first canary, 2026-11-21).
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: node-local-dns}
    - ipBlock: {cidr: 169.254.20.10/32}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to: [{ipBlock: {cidr: 169.254.169.252/32}}]
    ports: [{protocol: TCP, port: 988}]
  - to: [{ipBlock: {cidr: 169.254.169.254/32}}]
    ports: [{protocol: TCP, port: 80}]
  - to: [{ipBlock: {cidr: 199.36.153.8/30}}]
    ports: [{protocol: TCP, port: 443}]
