# The Substrate rung's worker pool (v1.0.1), in the shape of the vendor's sandbox demo
# (demos/sandbox/sandbox.yaml.tmpl at v1.0.0): gVisor workers, CPU requested below the limit so the
# pool places on a small node. The worker image is the published v1.0.1 release image, pinned by
# the digest its tag resolved to on 2026-11-21 (ghcr, anonymous pull).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-substrate
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: lab-agent-workers
  namespace: lab-substrate
  labels:
    workload: lab-agent
spec:
  replicas: 6
  workerImage: ghcr.io/agent-substrate/substrate/ateworker-gvisor@sha256:fd0c6a46d6c69d485856171e632906e774594bea9d00011a4d7038be3e084a2a
  sandboxClasses:
  - name: gvisor
  template:
    resources:
      limits:
        cpu: "2"
        memory: 3Gi
      requests:
        cpu: 500m
        memory: 3Gi
