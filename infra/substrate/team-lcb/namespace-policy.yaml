# The credential provider's grants, now for two teams. One shared ConfigMap: onboarding team two
# edits the platform's configuration here (counted in the onboarding ledger).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-credential-provider-namespace-policy
  namespace: ate-system
data:
  namespace-policy.yaml: |
    policies:
    - atespace: lab-agent
      allowedNamespaces:
      - lab-creds
    - atespace: lcb
      allowedNamespaces:
      - lcb-creds
